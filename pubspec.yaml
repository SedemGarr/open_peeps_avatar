name: open_peeps_avatar
description: Customisable Open Peeps avatars for Flutter games, with a one-int encoding, full-body poses and a themeable avatar editor.
version: 0.1.1
homepage: https://github.com/SedemGarr/open_peeps_avatar
repository: https://github.com/SedemGarr/open_peeps_avatar
issue_tracker: https://github.com/SedemGarr/open_peeps_avatar/issues
topics:
  - avatar
  - widget
  - game
  - svg

environment:
  sdk: ^3.10.1
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Only for tool/open_peeps_generator.dart.
  path: ^1.9.1

flutter:
  assets:
    - assets/peeps/accessories/
    - assets/peeps/body/
    - assets/peeps/face/
    - assets/peeps/facial-hair/
    - assets/peeps/head/
    - assets/peeps/pose/standing/
    - assets/peeps/pose/sitting/
